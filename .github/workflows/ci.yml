name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy pandas scikit-learn matplotlib joblib pytest
      - run: pytest -q
      - run: python run_pipeline.py --quick
